[project]
name = "bank_widget"
version = "1.0.0"
description = "Виджет для маскировки банковских карт и счетов"
authors = [{name = "Rajhana", email = "rajhana@example.com"}]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
line_length = 119
profile = "black"

[tool.flake8]
max-line-length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["venv", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
